<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact & Booking | Discover Lesotho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-sm navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Lesotho</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">HOME</a>
                <a class="nav-link" href="about.html">ABOUT</a>
                <a class="nav-link" href="services.html">ACTIVITIES</a>
                <a class="nav-link" href="gallery.html">DESTINATIONS</a>
                <a class="nav-link" href="contact.html">CONTACT</a>
            </div>
        </div>
    </nav>
    <button class="theme-btn" onclick="changeMode()">Dark / Light Mode</button>
    <br><h1>Contact and Booking</h1>
    <p>Send us your booking enquiry.</p><br>
</header>

<main class="container">
    <br>
    <div class="alert alert-success">Fill in the form below - we reply within 1 day.</div>
    <div class="row">
        <div class="col-sm-6">
            <section class="box">
                <h2>Contact Form</h2>
                <form onsubmit="return checkContact()">
                    <label for="fullName">Full Name:</label>
                    <input class="field" type="text" id="fullName" placeholder="Enter your name">
                    <label for="email">Email:</label>
                    <input class="field" type="text" id="email" placeholder="Enter your email">
                    <label for="phone">Phone Number:</label>
                    <input class="field" type="text" id="phone" placeholder="Enter your phone number">
                    <label for="message">Message:</label>
                    <textarea class="field" id="message" rows="4"></textarea>
                    <p class="error" id="formError"></p>
                    <button class="btn" type="submit">Submit</button>
                </form>
                <p id="formResult"></p>
            </section>
        </div>

        <div class="col-sm-6">
            <section class="box">
                <h2>Booking Form</h2>
                <form onsubmit="return checkBooking()">
                    <label for="destination">Destination</label>
                    <select class="field" id="destination">
                        <option value="">Choose destination</option>
                        <option>Maletsunyane Waterfalls</option>
                        <option>Sehlabathebe National Park</option>
                        <option>Katse Dam</option>
                    </select>
                    <label for="people">Number of Visitors</label>
                    <input class="field" type="number" id="people" min="1" value="1" oninput="calculateTotal()">
                    <p>Total Price: <span id="total">M100.00</span></p>
                    <label>Message:</label>
                    <textarea class="field" rows="4"></textarea>
                    <button class="btn" type="submit">Submit Booking</button>
                </form>
                <p id="bookingResult"></p>
            </section>
        </div>
    </div>
</main>

<footer>
    <p>&copy; Discover Lesotho</p>
    <p>Kingdom in the Sky | Maseru, Lesotho</p>
</footer>
<script src="script.js"></script>
</body>
</html>
