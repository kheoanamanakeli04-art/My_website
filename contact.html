</head>
<body>

	<nav>
		<a href="index.html">HOME</a>

		<a href="services.html">ACTIVITIES</a>

	<h1>Contact and Booking</h1>
    <p>Send us your booking enquiry.</p>
    </header>
<div class="form-container">
    <section class="form-box">
        <h2>Contact Form</h2>
    <form id="contactForm">
        <div class="form-group">
        <label>Full Name: </label>
        <input type="text" id="fullName" placeholder="Enter your name" required><br>
    </div>

    <div class="form-group">
        <label>Email: </label>
        <input type="email" id="email" placeholder="Enter your email" required><br>
    </div>

    <div class="form-group">
        <label>Phone Number: </label>
        <input type="text" id="phone" placeholder="Enter your phone number" required><br>
    </div>

    <div class="form-group">
        <label>Message: </label>
        <textarea id="message" rows="4"></textarea>
    </div>

        <button type="submit">Submit</button>
    </form>
    <p id="formResult" class="message"></p>
    </section>

    <section class="form-box">
    <h2>Booking Form</h2>
    <form id="bookingForm" onsubmit="submitForm()">
    <label>Destination</label>
        <select id="destination">
            <option value="">Choose destination</option>
            <option>Maletsunyane Waterfalls</option>
            <option>Sehlabathebe National Park</option>
            <option>Katse Dam</option>
        </select><br>
        <label>Number of Visitors</label>
        <input type="number" id="people" min="1" value="1" oninput="calculateTotal()"><br><br>
        <p>Total Price: <span id="total" required>M100.00</span></p>
        <label>Message:</label>
        <textarea id="message" rows="4"></textarea>
        <button type="submit">Submit Booking</button>
    
</form>

<p id="bookingResult" class="message"></p>
</section>
<script src='script.js'></script>

</body>
<footer><p>&copyDiscover Lesotho</p></footer>


</html>
